# Build + deploy neviai-email (Cloud Run, neviai-apps, asia-south1). Trigger: push to the default branch.
steps:
  - id: env
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args: ["-c", "gcloud secrets versions access latest --secret=neviai-email-env > .env.production"]
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "asia-south1-docker.pkg.dev/neviai-apps/neviai-images/neviai-email:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "asia-south1-docker.pkg.dev/neviai-apps/neviai-images/neviai-email:$SHORT_SHA"]
  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args: ["run", "deploy", "neviai-email", "--region", "asia-south1", "--image", "asia-south1-docker.pkg.dev/neviai-apps/neviai-images/neviai-email:$SHORT_SHA", "--update-labels", "commit=$SHORT_SHA"]
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
